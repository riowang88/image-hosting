<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<rect width="1200" height="420" fill="#f7f8fa"/><text x="60" y="54" font-family="Arial" font-size="28" font-weight="700" fill="#182230">法律设计的通知—反通知流程</text><text x="60" y="88" font-family="Arial" font-size="16" fill="#667085">平台的角色应当是程序中转，而不是最终裁判者</text>
<g font-family="Arial"><rect x="60" y="150" width="190" height="110" rx="10" fill="#fff" stroke="#d0d5dd"/><text x="155" y="188" text-anchor="middle" font-size="20" font-weight="700">权利人投诉</text><text x="155" y="220" text-anchor="middle" font-size="15" fill="#667085">通知和初步证据</text><rect x="330" y="150" width="190" height="110" rx="10" fill="#fff" stroke="#d0d5dd"/><text x="425" y="188" text-anchor="middle" font-size="20" font-weight="700">平台采取措施</text><text x="425" y="220" text-anchor="middle" font-size="15" fill="#667085">并转送通知</text><rect x="600" y="150" width="190" height="110" rx="10" fill="#fff" stroke="#d0d5dd"/><text x="695" y="188" text-anchor="middle" font-size="20" font-weight="700">用户反通知</text><text x="695" y="220" text-anchor="middle" font-size="15" fill="#667085">声明和初步证据</text><rect x="870" y="150" width="270" height="110" rx="10" fill="#e8f3ee" stroke="#56a77b"/><text x="1005" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#176b43">平台转送权利人</text><text x="1005" y="220" text-anchor="middle" font-size="15" fill="#176b43">15日内未投诉或起诉</text><path d="M250 205H320M520 205H590M790 205H860" stroke="#98a2b3" stroke-width="3"/><path d="M310 195l12 10-12 10M580 195l12 10-12 10M850 195l12 10-12 10" fill="#98a2b3"/><text x="1005" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#176b43">终止原措施，恢复用户权益</text><path d="M1005 265V294" stroke="#56a77b" stroke-width="3"/></g></svg>
