<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <defs>
    <style>
      .title { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #1a1a1a; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #333; }
      .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #666; }
      .big { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
      .tag { font: 600 11px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #9a3412; }
    </style>
  </defs>
  <rect width="720" height="400" fill="#fafafa" rx="12"/>
  <rect x="520" y="18" width="164" height="24" rx="6" fill="#ffedd5"/>
  <text x="602" y="34" text-anchor="middle" class="tag">示意演算 · 非实盘</text>
  <text x="36" y="40" class="title">更极端：正股跌 40% 后再回原点</text>
  <text x="36" y="64" class="sub">回到起点所需涨幅，杠杆 ETF 是正股的好几倍（理想 2 倍跟踪假设）</text>

  <rect x="36" y="90" width="300" height="220" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="36" y="90" width="300" height="44" rx="12" fill="#2563eb"/>
  <rect x="36" y="118" width="300" height="16" fill="#2563eb"/>
  <text x="186" y="118" text-anchor="middle" class="label" fill="#fff">正股 A（假设）</text>
  <text x="186" y="170" text-anchor="middle" class="sub">100 → 60（-40%）</text>
  <text x="186" y="210" text-anchor="middle" class="label">要涨回 100，需要</text>
  <text x="186" y="250" text-anchor="middle" class="big" fill="#2563eb">+66.7%</text>
  <text x="186" y="280" text-anchor="middle" class="sub">（100/60 − 1 ≈ 66.7%）</text>

  <rect x="384" y="90" width="300" height="220" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="384" y="90" width="300" height="44" rx="12" fill="#7c3aed"/>
  <rect x="384" y="118" width="300" height="16" fill="#7c3aed"/>
  <text x="534" y="118" text-anchor="middle" class="label" fill="#fff">2× 做多（假设）</text>
  <text x="534" y="170" text-anchor="middle" class="sub">10 → 2（-80%）</text>
  <text x="534" y="210" text-anchor="middle" class="label">要涨回 10，需要</text>
  <text x="534" y="250" text-anchor="middle" class="big" fill="#c0392b">+400%</text>
  <text x="534" y="280" text-anchor="middle" class="sub">（10/2 − 1 = 400%）</text>

  <rect x="36" y="330" width="648" height="50" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="360" y="352" text-anchor="middle" class="label" fill="#991b1b">若正股单日 -50%，理想 2 倍跟踪下约为 -100%</text>
  <text x="360" y="370" text-anchor="middle" class="sub">实盘还有费用、跟踪误差、熔断/结构限制，未必等于理论值</text>
</svg>
