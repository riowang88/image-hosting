<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect width="1080" height="730" fill="#ffffff"/><text x="60" y="80" font-size="40" fill="#1f2937" font-weight="700" text-anchor="start">这次到底测了什么</text><text x="60" y="126" font-size="25" fill="#6b7280" font-weight="400" text-anchor="start">大包没在任何设备上运行过，能不能启动都不知道</text><line x1="60" y1="160" x2="1020" y2="160" stroke="#d1d5db" stroke-width="2"/><text x="60" y="208" font-size="28" fill="#1f2937" font-weight="600" text-anchor="start">小包 · 看直播、换台、频道列表</text><text x="60" y="246" font-size="22" fill="#6b7280" font-weight="400" text-anchor="start">雷鸟电视、小米手机</text><rect x="860" y="190" width="160" height="44" rx="22" fill="#d1fae5" stroke="none" stroke-width="2"/><text x="940.0" y="220" font-size="22" fill="#047857" font-weight="600" text-anchor="middle">已实测</text><line x1="60" y1="268" x2="1020" y2="268" stroke="#d1d5db" stroke-width="2"/><text x="60" y="316" font-size="28" fill="#1f2937" font-weight="600" text-anchor="start">小包 · 手机手势、显示网速</text><text x="60" y="354" font-size="22" fill="#6b7280" font-weight="400" text-anchor="start">小米手机</text><rect x="860" y="298" width="160" height="44" rx="22" fill="#d1fae5" stroke="none" stroke-width="2"/><text x="940.0" y="328" font-size="22" fill="#047857" font-weight="600" text-anchor="middle">已实测</text><line x1="60" y1="376" x2="1020" y2="376" stroke="#d1d5db" stroke-width="2"/><text x="60" y="424" font-size="28" fill="#1f2937" font-weight="600" text-anchor="start">小包 · 1.2 新增的清晰度切换</text><text x="60" y="462" font-size="22" fill="#6b7280" font-weight="400" text-anchor="start">只在电脑上验证过网页逻辑</text><rect x="860" y="406" width="160" height="44" rx="22" fill="#fef3c7" stroke="none" stroke-width="2"/><text x="940.0" y="436" font-size="22" fill="#92400e" font-weight="600" text-anchor="middle">真机未测</text><line x1="60" y1="484" x2="1020" y2="484" stroke="#d1d5db" stroke-width="2"/><text x="60" y="532" font-size="28" fill="#1f2937" font-weight="600" text-anchor="start">安卓 5 大包</text><text x="60" y="570" font-size="22" fill="#6b7280" font-weight="400" text-anchor="start">只确认能下载、签名正确</text><rect x="860" y="514" width="160" height="44" rx="22" fill="#fee2e2" stroke="none" stroke-width="2"/><text x="940.0" y="544" font-size="22" fill="#b91c1c" font-weight="600" text-anchor="middle">完全未测</text><line x1="60" y1="592" x2="1020" y2="592" stroke="#d1d5db" stroke-width="2"/><text x="60" y="640" font-size="28" fill="#1f2937" font-weight="600" text-anchor="start">安卓 4.1 大包</text><text x="60" y="678" font-size="22" fill="#6b7280" font-weight="400" text-anchor="start">只确认能下载、签名正确</text><rect x="860" y="622" width="160" height="44" rx="22" fill="#fee2e2" stroke="none" stroke-width="2"/><text x="940.0" y="652" font-size="22" fill="#b91c1c" font-weight="600" text-anchor="middle">完全未测</text><line x1="60" y1="700" x2="1020" y2="700" stroke="#d1d5db" stroke-width="2"/></svg>